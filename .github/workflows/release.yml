name: release

# Сборка релиза по тегу: git tag v0.1.1 && git push --tags — дальше без участия человека.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Версия берётся из тега: v0.2.0 -> 0.2.0, чтобы --version не врал.
      - name: Version from tag
        shell: pwsh
        run: echo "VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" >> $env:GITHUB_ENV

      # Self-contained single-file: на целевой машине .NET не нужен.
      - name: Publish CLI
        run: >
          dotnet publish src/SteamInvValue.Cli -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ env.VERSION }} -o out/cli

      - name: Publish Web
        run: >
          dotnet publish src/SteamInvValue.Web -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ env.VERSION }} -o out/web

      # В архив кладём только exe: страница веб-морды зашита в сборку ресурсом.
      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/zips | Out-Null
          Compress-Archive -Path out/cli/steaminv.exe -DestinationPath out/zips/steaminv-cli-win-x64.zip -Force
          Compress-Archive -Path out/web/SteamInvValue.Web.exe -DestinationPath out/zips/steaminv-web-win-x64.zip -Force

      # Хеши публикуются в описании релиза: установщик и steaminv update сверяют по ним
      # скачанное. Ключей и отдельной инфраструктуры это не требует, а подмену файла ловит.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            out/zips/steaminv-cli-win-x64.zip `
            out/zips/steaminv-web-win-x64.zip `
            --title $env:GITHUB_REF_NAME --generate-notes

          $lines = Get-ChildItem out/zips/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            '- `{0}` - SHA-256 `{1}`' -f $_.Name, $hash
          }

          $body = gh release view $env:GITHUB_REF_NAME --json body -q .body
          $notes = @($body, '', '## Checksums', '') + $lines -join "`n"

          $file = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -Path $file -Value $notes -Encoding utf8
          gh release edit $env:GITHUB_REF_NAME --notes-file $file
