<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Инвентари Steam</title>
<style>
  :root{--bg:#11161d;--panel:#1a212b;--line:#2a3542;--txt:#e6edf3;--dim:#8b98a8;--acc:#4a9eff;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt)}
  a{color:var(--acc)}
  .top{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .top h1{font-size:16px;margin:0;font-weight:600}
  .total{margin-left:auto;text-align:right}
  .total .v{font-size:19px;font-weight:600}
  .total .s{font-size:12px;color:var(--dim)}
  .layout{display:flex;align-items:flex-start;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
  .side{flex:0 0 300px;position:sticky;top:16px}
  .main{flex:1 1 auto;min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:14px;font-weight:600}
  input,select,button,textarea{font:inherit;color:var(--txt);background:#0d1117;border:1px solid var(--line);border-radius:7px;padding:8px 10px}
  input,select,textarea{width:100%}
  button{background:#222c38;border-color:var(--line);cursor:pointer;width:auto}
  button:hover{border-color:var(--acc)}
  button.pri{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:600}
  button.sm{padding:3px 8px;font-size:12px}
  button:disabled{opacity:.45;cursor:default}
  label{color:var(--dim);font-size:12px;display:block;margin:0 0 4px}
  .field{margin-bottom:9px}
  .prof{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer;background:#0d1117}
  .prof:hover{border-color:var(--acc)}
  .prof.sel{border-color:var(--acc);background:#132030}
  .prof .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .prof .sub{color:var(--dim);font-size:12px;display:flex;justify-content:space-between;gap:8px;margin-top:2px}
  .prof .acts{display:flex;gap:6px;margin-top:7px}
  .dot{width:7px;height:7px;border-radius:99px;display:inline-block;flex:0 0 auto}
  .dot.run{background:var(--warn);animation:pulse 1s infinite alternate}
  .dot.err{background:var(--bad)}
  .dot.ok{background:var(--ok)}
  .dot.off{background:var(--dim)}
  @keyframes pulse{from{opacity:.3}to{opacity:1}}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}
  .tile{background:#0d1117;border:1px solid var(--line);border-radius:9px;padding:12px}
  .tile .k{color:var(--dim);font-size:12px}
  .tile .v{font-size:20px;font-weight:600;margin:3px 0}
  .tile .s{color:var(--dim);font-size:12px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--dim);font-weight:500;font-size:12px}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  pre#log{background:#0d1117;border:1px solid var(--line);border-radius:7px;padding:10px;max-height:170px;overflow:auto;font:12px/1.45 Consolas,monospace;color:var(--dim);white-space:pre-wrap;margin:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .it{background:#0d1117;border:1px solid var(--line);border-radius:9px;padding:9px;display:flex;flex-direction:column;gap:5px}
  .it img{width:100%;height:92px;object-fit:contain;background:#161c24;border-radius:6px}
  .it .nm{font-size:12px;line-height:1.35;height:48px;overflow:hidden}
  .it .pr{font-size:15px;font-weight:600}
  .it .q{font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
  .it .q a{color:var(--acc);text-decoration:none}
  .it .q a:hover{text-decoration:underline}
  .it .nm a{color:inherit;text-decoration:none}
  .it .nm a:hover{color:var(--acc)}
  .badge{font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>div{flex:1 1 150px}
  .row>div.grow{flex:3 1 260px}
  .chk{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px}
  .chk input{width:auto}
  .muted{color:var(--dim)}
  .hidden{display:none}
  @media(max-width:900px){.layout{flex-direction:column}.side{position:static;flex:1 1 auto;width:100%}}
</style>
</head>
<body>
<div class="top">
  <h1 data-t="appTitle"></h1>
  <button id="refreshAll" data-t="refreshAll"></button>
  <button id="toggleSettings" data-t="settings"></button>
  <div id="version" class="muted" style="font-size:12px"></div>
  <div class="total"><div class="v" id="totalRub">—</div><div class="s" id="totalUsd"></div></div>
</div>

<div class="layout">
  <div class="side">
    <div class="card">
      <h3 data-t="watched"></h3>
      <div id="profiles"><div class="muted" data-t="loading"></div></div>
    </div>

    <div class="card">
      <h3 data-t="addTitle"></h3>
      <div class="field"><label data-t="linkLabel"></label>
        <input type="text" id="newProfile" placeholder="https://steamcommunity.com/id/nickname"></div>
      <div class="field"><label data-t="nameLabel"></label><input type="text" id="newName"></div>
      <div class="field"><label data-t="appsLabel"></label><input type="text" id="newApps" placeholder="730,753"></div>
      <button class="pri" id="add" data-t="addButton"></button>
      <div id="addErr" class="muted" style="margin-top:8px"></div>
    </div>

    <div class="card hidden" id="settings">
      <h3 data-t="settings"></h3>
      <div class="field"><label data-t="uiLangLabel"></label>
        <select id="setUi"><option value="ru">Русский</option><option value="en">English</option></select></div>
      <div class="field"><label class="chk"><input type="checkbox" id="setSteam"> <span data-t="askSteam"></span></label></div>
      <div class="field"><label class="chk"><input type="checkbox" id="setUpdates"> <span data-t="checkUpdates"></span></label></div>
      <div class="field"><label data-t="budgetLabel"></label><input type="text" id="setBudget"></div>
      <div class="field"><label data-t="delayLabel"></label><input type="text" id="setDelay"></div>
      <div class="field"><label data-t="autoLabel"></label><input type="text" id="setAuto"></div>
      <div class="field"><label data-t="itemLangLabel"></label>
        <select id="setLang"><option value="english">english</option><option value="russian">russian</option></select></div>
      <div class="field"><label data-t="proxyLabel"></label><input type="text" id="setProxy"></div>
      <div class="field"><label data-t="cookieLabel"></label><input type="text" id="setCookie"></div>
      <button class="pri" id="saveSettings" data-t="save"></button>
      <div class="muted" style="margin-top:9px;font-size:12px" id="cfgPath"></div>
    </div>
  </div>

  <div class="main">
    <div class="card hidden" id="logCard"><h3 id="logTitle"></h3><pre id="log"></pre></div>

    <div id="empty" class="card muted" data-t="pickOne"></div>

    <div id="out" class="hidden">
      <div class="card">
        <div id="who" class="muted" style="margin-bottom:11px"></div>
        <div class="tiles" id="tiles"></div>
      </div>
      <div class="card hidden" id="planCard">
        <h3 data-t="planTitle"></h3>
        <div id="planSummary" class="muted" style="margin-bottom:9px"></div>
        <div id="plan"></div>
        <div id="planTail" class="muted" style="margin-top:9px"></div>
      </div>

      <div class="card">
        <h3 data-t="itemsTitle"></h3>
        <div class="row" style="margin-bottom:11px">
          <div class="grow"><label data-t="searchLabel"></label><input type="text" id="q" placeholder="AK-47…"></div>
          <div><label data-t="sortLabel"></label><select id="sort">
            <option value="total" data-t="sortTotal"></option>
            <option value="unit" data-t="sortUnit"></option>
            <option value="count" data-t="sortCount"></option>
            <option value="name" data-t="sortName"></option>
            <option value="game" data-t="sortGame"></option>
          </select></div>
          <div><label data-t="gameLabel"></label><select id="game"></select></div>
          <div style="flex:0 0 auto"><label class="chk"><input type="checkbox" id="onlyPriced" checked> <span data-t="onlyPriced"></span></label></div>
          <div style="flex:0 0 auto"><label class="chk"><input type="checkbox" id="onlyTradable"> <span data-t="onlyTradable"></span></label></div>
          <div style="flex:0 0 auto"><label class="chk"><input type="checkbox" id="onlyNoSales"> <span data-t="onlyNoSales"></span></label></div>
          <div style="flex:0 0 auto"><label class="chk"><input type="checkbox" id="onlyPlan"> <span data-t="onlyPlan"></span></label></div>
        </div>
        <div id="count" class="muted" style="margin-bottom:10px"></div>
        <div class="grid" id="items"></div>
        <div style="margin-top:12px"><button id="more" class="hidden" data-t="showMore"></button></div>
      </div>
      <div class="card hidden" id="diffCard">
        <h3 data-t="diffTitle"></h3>
        <div id="diffSummary" class="muted" style="margin-bottom:9px"></div>
        <div id="diff"></div>
      </div>

      <div class="card"><h3 data-t="historyTitle"></h3><div id="history"></div></div>
      <div class="card"><h3 data-t="byMarketplace"></h3><div id="prov"></div></div>
      <div class="card" id="appsCard"><h3 data-t="byGame"></h3><div id="apps_t"></div></div>
      <div class="card hidden" id="notesCard"><h3 data-t="notes"></h3><ul id="notes" class="muted"></ul></div>
    </div>
  </div>
</div>

// ---- перевод -----------------------------------------------------------------------------
const I18N = {

    tUnsellable: 'Продать нельзя', tUnsellableSub: ' позиций без обмена и маркета · в суммы не входят',

    salesDay: ' прод./сут', noSales: 'нет продаж', onlyNoSales: 'только неликвид',

    colSteam: 'Steam, $', colDate: 'Замер', colChange: 'изм.',

    tGain: 'Gain vs Steam', tGainSub: ' positions', tGainSkipped: ' · Steam skipped ', tGainNames: ' names',

    tUnsellable: 'Cannot be sold', tUnsellableSub: ' positions with no trading and no market · excluded from totals',

    planTitle: 'What to sell', onlyPlan: 'plan only',
    diffTitle: 'What changed',

    diffSplit: (items, prices) => 'of that ' + items + ' RUB from inventory changes and ' + prices + ' RUB from prices',
    diffAppeared: 'Appeared', diffGone: 'Gone', diffCount: 'Count', diffPrice: 'Prices',
    diffNothing: 'Nothing changed between the two measurements.',
    planSummary: (n, share, rub) => n + ' positions give ' + share + '% of the money — that is ' + rub + ' RUB',
    planTail: (n, rub) => 'The other ' + n + ' positions add ' + rub + ' RUB, and that is one listing each.',
    colSum: 'Sum, RUB', colSales: 'Sales/day',
    salesDay: ' sales/day', noSales: 'no sales', onlyNoSales: 'no-sale items only',
    colMarketplace: 'Marketplace', colList: 'List, $', colPayout: 'Payout, $', colPayoutRub: 'Payout, RUB',
    colPositions: 'Positions', colGame: 'Game', colItems: 'Items', colBest: 'Best price, $',
    colSteam: 'Steam, $', colDate: 'Measurement', colChange: 'change',
    histNone: 'This is the first measurement — history starts with the second one.',
    histSummary: (n, ch, min, max) => n + ' measurements · ' + ch + ' overall · low ' + min + ' RUB, high ' + max + ' RUB',
    itemsSummary: (pos, pcs, usd) => pos + ' positions · ' + pcs + ' items · ' + usd + ' $',
    noPrice: 'no price', perPc: ' $/pc',
    badgeNoSell: 'cannot sell', badgeTradable: 'tradable', badgeMarket: 'market only',
    locale: 'en-US',
  },
};

let lang = 'ru';
const t = k => (I18N[lang][k] ?? I18N.ru[k] ?? k);

function applyStatic() {
  document.documentElement.lang = lang;
  document.title = t('appTitle');
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
}

// ---- вспомогательное ---------------------------------------------------------------------
const el = id => document.getElementById(id);
const money = (n, d = 2) => (n ?? 0).toLocaleString(t('locale'), {minimumFractionDigits: d, maximumFractionDigits: d});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tile = (k, v, s) => '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>';
const dt = s => s ? new Date(s).toLocaleString(t('locale'), {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';

let state = null, selected = null, report = null, shown = 0, settingsLoaded = false;

// ---- список инвентарей -------------------------------------------------------------------

async function loadState() {
  state = await (await fetch('/api/state')).json();

  if (state.settings.interfaceLanguage && state.settings.interfaceLanguage !== lang) {
    lang = state.settings.interfaceLanguage;
    applyStatic();
    if (report) render();
  }

  el('totalRub').textContent = money(state.totalRub, 0) + ' ' + t('rub');
  el('totalUsd').textContent = money(state.totalUsd) + ' ' + t('totalAll');
  el('cfgPath').textContent = t('configAt') + state.configPath;

  const up = state.update;
  el('version').innerHTML = 'v' + state.version +
    (up && up.isNewer
      ? ' · <a href="' + up.url + '" target="_blank">' + t('updateNew') + up.latest + '</a> · ' + t('updateHow')
      : '');

  if (!settingsLoaded) fillSettings();

  el('profiles').innerHTML = state.profiles.length === 0
    ? '<div class="muted">' + t('pickOne') + '</div>'
    : state.profiles.map(p => {
        const cls = p.status === 'running' ? 'run' : p.status === 'error' ? 'err' : !p.enabled ? 'off' : p.hasReport ? 'ok' : 'off';
        return '<div class="prof' + (selected === p.id ? ' sel' : '') + '" data-id="' + p.id + '">' +
          '<div class="nm"><span>' + esc(p.name) + '</span><span class="dot ' + cls + '"></span></div>' +
          '<div class="sub"><span>' + money(p.bestRub, 0) + ' ' + t('rub') + '</span><span>' + p.items + ' ' + t('pcs') + '</span></div>' +
          '<div class="sub"><span>' + dt(p.lastRun) + '</span><span>' + (p.apps ? p.apps.join(',') : t('allGames')) + '</span></div>' +
          '<div class="acts">' +
            '<button class="sm" data-act="refresh">' + t('refresh') + '</button>' +
            '<button class="sm" data-act="toggle">' + (p.enabled ? t('off') : t('on')) + '</button>' +
            '<button class="sm" data-act="del">' + t('del') + '</button>' +
          '</div></div>';
      }).join('');

  const sel = state.profiles.find(p => p.id === selected);
  if (sel && sel.status === 'running') pollLog(sel.id);
}

el('profiles').onclick = async e => {
  const card = e.target.closest('.prof');
  if (!card) return;
  const id = card.dataset.id;
  const act = e.target.dataset && e.target.dataset.act;

  if (act === 'refresh') { await fetch('/api/profiles/' + id + '/refresh', {method: 'POST'}); return loadState(); }
  if (act === 'toggle')  { await fetch('/api/profiles/' + id + '/toggle',  {method: 'POST'}); return loadState(); }
  if (act === 'del') {
    if (!confirm(t('confirmDel'))) return;
    await fetch('/api/profiles/' + id, {method: 'DELETE'});
    if (selected === id) { selected = null; report = null; el('out').classList.add('hidden'); el('empty').classList.remove('hidden'); }
    return loadState();
  }
  select(id);
};

async function select(id) {
  selected = id;
  await loadState();
  await loadReport(id);
  const p = state.profiles.find(x => x.id === id);
  if (p && p.status === 'running') pollLog(id);
}

// ---- отчёт -------------------------------------------------------------------------------

async function loadReport(id) {
  const resp = await fetch('/api/report/' + id);
  if (!resp.ok) {
    report = null;
    el('out').classList.add('hidden');
    el('empty').classList.remove('hidden');
    return;
  }
  report = await resp.json();
  el('empty').classList.add('hidden');
  el('out').classList.remove('hidden');
  render();
  renderHistory(id);
  renderDiff(id);
}

function render() {
  const r = report;
  el('who').innerHTML = esc(r.personaName || '') + ' · <a href="' + r.profileUrl + '" target="_blank">' + r.profileUrl + '</a>' +
    ' · ' + t('collected') + ' ' + new Date(r.generatedAt).toLocaleString(t('locale')) +
    ' · ' + t('rate') + ' ' + money(r.usdRub) + ' ' + t('rub') + '/$';

  const b = r.bestSplit, s = r.steamNet, g = r.steamGross;
  const cash = r.bestCash || b, mixCash = r.mixedCashPart || b, mixWallet = r.mixedWalletPart || {rub: 0, usd: 0};
  const steamOnly = r.steamOnly || {rub: 0, usd: 0};
  const cmp = r.bestWhereSteamKnown || b;
  const diff = (s.usd > 0 && r.steamCovered > 0) ? ((cmp.usd / s.usd - 1) * 100) : 0;
  const skipped = r.steamSkipped || 0;

  el('tiles').innerHTML =
    tile(t('tCash'), money(cash.rub, 0) + ' ' + t('rub'),
         money(cash.usd) + ' $ · ' + money(cash.usdt) + ' USDT · ' + money(cash.btc, 8) + ' BTC · ' + t('tCashSub')) +
    tile(t('tWallet'), money(s.rub, 0) + ' ' + t('rub'), money(s.usd) + ' $ · ' + t('tWalletSub')) +
    (r.steamCovered > 0
      ? tile(t('tMedian'), money((r.steamNetMedian || {rub: 0}).rub, 0) + ' ' + t('rub'),
             t('tMedianSub')(r.medianCovered || 0, r.steamCovered))
      : '') +
    tile(t('tMax'), money(b.rub, 0) + ' ' + t('rub'),
         money(mixCash.rub, 0) + t('tMaxCash') + money(mixWallet.rub, 0) + t('tMaxWallet') +
         (steamOnly.rub > 0 ? ' · ' + money(steamOnly.rub, 0) + t('tMaxOnly') : '')) +
    tile(t('tGross'), money(g.rub, 0) + ' ' + t('rub'), money(g.usd) + ' ' + t('tGrossSub')) +
    tile(t('tGain'), (diff >= 0 ? '+' : '') + money(diff, 1) + ' %',
         r.steamCovered + ' ' + t('of') + ' ' + r.pricedItems + t('tGainSub') +
         (skipped > 0 ? t('tGainSkipped') + skipped + t('tGainNames') : '')) +
    tile(t('tItems'), r.totalItems + ' ' + t('pcs'),
         r.uniqueItems + t('tItemsSub1') + r.pricedItems + t('tItemsSub2') + r.unpricedItems) +
    tile(t('tLiquidity'), r.tradableItems + t('tTradable'), r.marketableItems + t('tLiquiditySub')) +
    tile(t('tUnsellable'), (r.unsellableCount || 0) + ' ' + t('pcs'),
         (r.unsellablePositions || 0) + t('tUnsellableSub')) +
    tile(t('tNoSales'), money((r.noSalesValue || {rub: 0}).rub, 0) + ' ' + t('rub'),
         (r.noSalesPositions || 0) + t('tNoSalesSub'));

  el('prov').innerHTML = '<table><tr><th>' + t('colMarketplace') + '</th><th class="n">' + t('colList') +
    '</th><th class="n">' + t('colPayout') + '</th><th class="n">' + t('colPayoutRub') + '</th><th class="n">' + t('colPositions') + '</th></tr>' +
    r.byProvider.map(p => '<tr><td>' + esc(p.provider) + '</td><td class="n">' + money(p.listUsd) + '</td><td class="n">' +
      money(p.payoutUsd) + '</td><td class="n">' + money(p.payoutUsd * r.usdRub, 0) + '</td><td class="n">' + p.covered + '</td></tr>').join('') + '</table>';

  el('appsCard').classList.toggle('hidden', r.byApp.length < 2);
  el('apps_t').innerHTML = '<table><tr><th>' + t('colGame') + '</th><th class="n">' + t('colItems') +
    '</th><th class="n">' + t('colBest') + '</th><th class="n">' + t('colSteam') + '</th><th class="n">' + t('rub') + '</th></tr>' +
    r.byApp.map(a => '<tr><td>' + esc(a.appName) + '</td><td class="n">' + a.items + '</td><td class="n">' + money(a.bestUsd) +
      '</td><td class="n">' + money(a.steamUsd) + '</td><td class="n">' + money(a.bestUsd * r.usdRub, 0) + '</td></tr>').join('') + '</table>';

  // Список игр для фильтра: порядок как в таблице «по играм», то есть по стоимости.
  const chosen = el('game').value;
  el('game').innerHTML = '<option value="">' + t('allGamesOption') + '</option>' +
    r.byApp.map(a => '<option value="' + a.appId + '">' + esc(a.appName) + ' (' + a.items + ')</option>').join('');
  if (chosen && r.byApp.some(a => String(a.appId) === chosen)) el('game').value = chosen;

  const plan = r.items.filter(p => p.inSellPlan);
  el('planCard').classList.toggle('hidden', plan.length === 0);
  if (plan.length) {
    el('planSummary').textContent = t('planSummary')(r.sellPlanPositions, money(r.sellPlanShare, 0),
                                                     money((r.sellPlanValue || {rub: 0}).rub, 0));
    el('plan').innerHTML = '<table><tr><th>' + t('colGame') + '</th><th></th><th class="n">' + t('colSum') +
      '</th><th>' + t('colMarketplace') + '</th><th class="n">' + t('colSales') + '</th></tr>' +
      plan.map(p => '<tr><td>' + esc(appName(p.item.appId)) + '</td><td>' +
        esc(p.item.marketHashName || p.item.name) + '</td><td class="n">' +
        money(p.bestTotalUsd * r.usdRub, 0) + '</td><td>' +
        link(listingUrl(p.best.provider, p.item), esc(p.best.provider)) + '</td><td class="n">' +
        (p.steam ? (p.steamVolume || 0) : '—') + '</td></tr>').join('') + '</table>';
    el('planTail').textContent = r.tailPositions > 0
      ? t('planTail')(r.tailPositions, money((r.tailValue || {rub: 0}).rub, 0)) : '';
  }

  el('notesCard').classList.toggle('hidden', !(r.notes && r.notes.length));
  if (r.notes && r.notes.length) el('notes').innerHTML = r.notes.map(n => '<li>' + esc(n) + '</li>').join('');

  renderItems();
}

// ---- история -----------------------------------------------------------------------------

async function renderHistory(id) {
  const hist = await (await fetch('/api/history/' + id + '?limit=200')).json();
  if (!hist.length) { el('history').innerHTML = '<div class="muted">' + t('histNone') + '</div>'; return; }

  const w = 640, h = 90, pad = 4;
  const vals = hist.map(s => s.bestRub);
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const pts = hist.map((s, i) => {
    const x = hist.length === 1 ? w / 2 : pad + i * (w - 2 * pad) / (hist.length - 1);
    const y = h - pad - (s.bestRub - min) / span * (h - 2 * pad);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');

  const first = hist[0], last = hist[hist.length - 1];
  const change = first.bestRub > 0 ? (last.bestRub / first.bestRub - 1) * 100 : 0;

  const rows = hist.slice(-12).reverse().map((s, i, arr) => {
    const prev = arr[i + 1];
    const d = prev && prev.bestUsd > 0 ? ((s.bestUsd / prev.bestUsd - 1) * 100) : null;
    return '<tr><td>' + new Date(s.at).toLocaleString(t('locale')) + '</td><td class="n">' + money(s.bestRub, 0) +
      '</td><td class="n">' + money(s.bestUsd) + '</td><td class="n">' +
      (d === null ? '—' : (d >= 0 ? '+' : '') + money(d, 1) + '%') + '</td><td class="n">' + s.items + '</td></tr>';
  }).join('');

  el('history').innerHTML =
    '<div class="muted" style="margin-bottom:8px">' +
      t('histSummary')(hist.length, (change >= 0 ? '+' : '') + money(change, 1) + '%', money(min, 0), money(max, 0)) + '</div>' +
    '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:90px;display:block;margin-bottom:10px">' +
      '<polyline points="' + pts + '" fill="none" stroke="#4a9eff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>' +
    '<table><tr><th>' + t('colDate') + '</th><th class="n">' + t('rub') + '</th><th class="n">$</th><th class="n">' +
      t('colChange') + '</th><th class="n">' + t('colItems') + '</th></tr>' + rows + '</table>';
}

// ---- что изменилось ----------------------------------------------------------------------

async function renderDiff(id) {
  const resp = await fetch('/api/diff/' + id);
  if (resp.status !== 200) { el('diffCard').classList.add('hidden'); return; }

  const d = await resp.json();
  el('diffCard').classList.remove('hidden');

  const sign = v => (v >= 0 ? '+' : '') + money(v, 0);
  el('diffSummary').innerHTML =
    t('diffSummary')(money(d.totalBefore.rub, 0), money(d.totalAfter.rub, 0), sign(d.delta.rub)) +
    '<br>' + t('diffSplit')(sign(d.deltaFromItems.rub), sign(d.deltaFromPrices.rub));

  const rows = (title, lines, cell) => lines.length === 0 ? '' :
    '<tr><th colspan="3">' + title + ' (' + lines.length + ')</th></tr>' +
    lines.slice(0, 10).map(l => '<tr><td>' + esc(l.name) + '</td><td class="n">' + cell(l) +
      '</td><td class="n">' + sign(l.deltaUsd * (report.usdRub || 0)) + ' ' + t('rub') + '</td></tr>').join('');

  const body =
    rows(t('diffAppeared'), d.appeared, l => l.countAfter + ' ' + t('pcs')) +
    rows(t('diffGone'), d.gone, l => l.countBefore + ' ' + t('pcs')) +
    rows(t('diffCount'), d.countChanged, l => l.countBefore + ' → ' + l.countAfter) +
    rows(t('diffPrice'), d.priceChanged, l => money(l.pricePercent, 1) + '%');

  el('diff').innerHTML = body ? '<table>' + body + '</table>' : '<div class="muted">' + t('diffNothing') + '</div>';
}

// ---- предметы ----------------------------------------------------------------------------

function filtered() {
  const q = el('q').value.trim().toLowerCase();
  const game = el('game').value;
  const list = report.items.filter(p =>
    (!el('onlyPriced').checked || p.bestTotalUsd > 0) &&
    (!el('onlyTradable').checked || p.item.tradable) &&
    (!el('onlyNoSales').checked || (p.steam && !p.steamVolume)) &&
    (!el('onlyPlan').checked || p.inSellPlan) &&
    (!game || String(p.item.appId) === game) &&
    (!q || (p.item.marketHashName || p.item.name).toLowerCase().includes(q)));

  const mode = el('sort').value;
  const key = {
    total: p => -p.bestTotalUsd,
    unit: p => -((p.best && p.best.payoutUsd) || 0),
    count: p => -p.item.count,
  }[mode];

  if (mode === 'game') {
    // Игры идут в порядке их стоимости, внутри игры — предметы по стоимости.
    const order = {};
    report.byApp.forEach((a, i) => { order[a.appId] = i; });
    list.sort((a, b) => (order[a.item.appId] ?? 99) - (order[b.item.appId] ?? 99) || b.bestTotalUsd - a.bestTotalUsd);
  } else {
    list.sort(key ? (a, b) => key(a) - key(b)
                  : (a, b) => (a.item.marketHashName || a.item.name).localeCompare(b.item.marketHashName || b.item.name));
  }
  return list;
}

// Для Steam адрес лота предсказуем, у остальных — поиск по имени: их адреса предметов
// формируются по-своему и без гарантий, а поиск работает всегда.
function listingUrl(provider, item) {
  const name = encodeURIComponent(item.marketHashName || item.name);
  if (provider === 'Steam') return 'https://steamcommunity.com/market/listings/' + item.appId + '/' + name;
  if (provider === 'Skinport') return 'https://skinport.com/market?search=' + name;
  if (provider === 'Waxpeer') return 'https://waxpeer.com/?search=' + name;
  if (provider === 'Market.CSGO') return 'https://market.csgo.com/?search=' + name;
  return null;
}

const link = (url, text) => url ? '<a href="' + url + '" target="_blank" rel="noopener">' + text + '</a>' : text;

function appName(appId) {
  const found = report.byApp.find(a => a.appId === appId);
  return found ? found.appName : String(appId);
}

function renderItems(reset = true) {
  const list = filtered();
  if (reset) { shown = 0; el('items').innerHTML = ''; }
  const slice = list.slice(shown, shown + 60);
  shown += slice.length;

  el('count').textContent = t('itemsSummary')(
    list.length,
    list.reduce((s, p) => s + p.item.count, 0),
    money(list.reduce((s, p) => s + p.bestTotalUsd, 0)));

  el('items').insertAdjacentHTML('beforeend', slice.map(p => {
    const i = p.item, best = p.best;
    const quotes = (p.quotes || []).slice().sort((a, b) => b.payoutUsd - a.payoutUsd)
      .map(q => '<div class="q"><span>' + link(listingUrl(q.provider, i), esc(q.provider)) +
                '</span><span>' + money(q.payoutUsd) + ' $</span></div>').join('');
    const badge = !i.tradable && !i.marketable ? t('badgeNoSell') : i.tradable ? t('badgeTradable') : t('badgeMarket');
    const median = p.steamMedianUsd > 0
      ? '<div class="q"><span>' + t('medianShort') + '</span><span>' + money(p.steamMedianUsd) + ' $</span></div>'
      : '';
    const sales = p.steam
      ? '<div class="q"><span>' + (p.steamVolume > 0 ? p.steamVolume + t('salesDay') : t('noSales')) + '</span><span></span></div>'
      : '';
    return '<div class="it">' +
      '<img loading="lazy" src="' + (i.iconUrl ? '/img/' + i.iconUrl + '/128fx128f' : '') + '" alt="">' +
      '<div class="nm">' + link(listingUrl('Steam', i), esc(i.marketHashName || i.name)) + '</div>' +
      '<div class="pr">' + (best ? money(p.bestTotalUsd * report.usdRub, 0) + ' ' + t('rub') : '<span class="muted">' + t('noPrice') + '</span>') + '</div>' +
      '<div class="q"><span>' + i.count + ' ' + t('pcs') + '</span><span>' + (best ? money(best.payoutUsd) + t('perPc') : '') + '</span></div>' +
      quotes + median + sales +
      '<div><span class="badge">' + esc(appName(i.appId)) + '</span> <span class="badge">' + badge + '</span> ' +
      (i.rarity ? '<span class="badge">' + esc(i.rarity) + '</span>' : '') + '</div>' +
    '</div>';
  }).join(''));

  el('more').classList.toggle('hidden', shown >= list.length);
}

// ---- лог текущего прогона ----------------------------------------------------------------

let logTimer = null;
async function pollLog(id) {
  clearTimeout(logTimer);
  const r = await (await fetch('/api/jobs/' + id)).json();
  const prof = state.profiles.find(p => p.id === id);
  el('logTitle').textContent = t('counting') + (prof ? prof.name : id);
  el('logCard').classList.toggle('hidden', r.status === 'idle' || (r.log || []).length === 0);
  el('log').textContent = (r.log || []).join('\n');
  el('log').scrollTop = el('log').scrollHeight;

  if (r.status === 'running') { logTimer = setTimeout(() => pollLog(id), 1500); return; }
  await loadState();
  if (selected === id) await loadReport(id);
}

// ---- добавление и настройки --------------------------------------------------------------

el('add').onclick = async () => {
  const profile = el('newProfile').value.trim();
  if (!profile) return;
  el('add').disabled = true;
  el('addErr').textContent = t('adding');

  const apps = el('newApps').value.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
  const resp = await fetch('/api/profiles', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({profile, name: el('newName').value.trim() || null, apps})
  });
  el('add').disabled = false;

  if (!resp.ok) { el('addErr').textContent = (await resp.json()).error || t('failed'); return; }
  const p = await resp.json();
  el('addErr').textContent = '';
  el('newProfile').value = el('newName').value = el('newApps').value = '';
  await select(p.id);
};

el('refreshAll').onclick = async () => { await fetch('/api/refresh-all', {method: 'POST'}); loadState(); };
el('toggleSettings').onclick = () => el('settings').classList.toggle('hidden');

function fillSettings() {
  const s = state.settings;
  el('setUi').value = s.interfaceLanguage || 'ru';
  el('setSteam').checked = s.enabled;
  el('setUpdates').checked = s.checkUpdates === true;
  el('setBudget').value = s.budget;
  el('setDelay').value = s.delayMs;
  el('setAuto').value = s.autoRefreshMinutes;
  el('setLang').value = s.language;
  el('setProxy').placeholder = s.hasProxy ? '•••' : '—';
  el('setCookie').placeholder = s.hasCookie ? '•••' : '—';
  settingsLoaded = true;
}

el('saveSettings').onclick = async () => {
  const body = {
    interfaceLanguage: el('setUi').value,
    steamEnabled: el('setSteam').checked,
    checkUpdates: el('setUpdates').checked,
    steamBudget: parseInt(el('setBudget').value) || 0,
    steamDelayMs: parseInt(el('setDelay').value) || 0,
    autoRefreshMinutes: parseInt(el('setAuto').value) || 0,
    language: el('setLang').value,
  };
  if (el('setProxy').value.trim()) body.proxy = el('setProxy').value.trim();
  if (el('setCookie').value.trim()) body.cookie = el('setCookie').value.trim();

  await fetch('/api/settings', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  el('setProxy').value = el('setCookie').value = '';
  settingsLoaded = false;
  await loadState();
};

el('more').onclick = () => renderItems(false);
['q', 'sort', 'game', 'onlyPriced', 'onlyTradable', 'onlyNoSales', 'onlyPlan'].forEach(id => el(id).addEventListener('input', () => report && renderItems()));
el('newProfile').addEventListener('keydown', e => { if (e.key === 'Enter') el('add').click(); });

applyStatic();
loadState().then(() => { if (state.profiles.length) select(state.profiles[0].id); });
setInterval(loadState, 5000);
</script>
